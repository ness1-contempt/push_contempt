name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Installa le dipendenze
        run: composer install --no-progress --prefer-dist

      - name: Lint (WPCS)
        run: vendor/bin/phpcs

      - name: Test
        run: vendor/bin/phpunit

  integration:
    # Controller REST su WordPress e WooCommerce veri, con un database di prova.
    # Le versioni sono fissate: si cambiano di proposito, non a sorpresa.
    runs-on: ubuntu-latest
    env:
      WP_VERSION: "7.1.3"
      WC_VERSION: "11.2.1"
      WP_TESTS_WP_DIR: /tmp/wp-core
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: composer

      - name: Installa le dipendenze
        run: composer install --no-progress --prefer-dist

      - name: Scarica WordPress e WooCommerce
        run: bin/install-wp-tests.sh "$WP_TESTS_WP_DIR"

      - name: Test di integrazione
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa le dipendenze
        run: npm ci

      - name: Test
        run: npm run test:unit

      - name: Build
        run: npm run build
